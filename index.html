<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جوس لاين | التحليل المالي</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>جوس لاين</h1><p>النظام المالي والتحليلي 2026</p></header><nav><a href="#overview">نظرة عامة</a><a href="#entry">إدخال البيانات</a><a href="#products">الأكثر مبيعًا وربحًا</a></nav><main><section id="overview"><h2>النظرة العامة</h2><div class="cards"><div><b id="salesTotal">0</b><span>إجمالي الإيرادات</span></div><div><b id="costTotal">0</b><span>إجمالي التكاليف</span></div><div><b id="profitTotal">0</b><span>صافي الربح</span></div><div><b id="marginTotal">0%</b><span>هامش الربح</span></div></div><div class="chart" id="months"></div></section><section id="entry"><h2>إدخال بيانات المنتج</h2><form id="saleForm"><input name="product" placeholder="اسم المنتج" required><input name="category" placeholder="تصنيف المنتج" required><input name="qty" type="number" min="1" placeholder="الكمية" required><input name="revenue" type="number" min="0" step="0.01" placeholder="الإيراد بالريال" required><input name="cost" type="number" min="0" step="0.01" placeholder="التكلفة بالريال" required><input name="date" type="date" min="2026-01-01" max="2026-12-31" required><button>حفظ البيانات</button></form><p id="message"></p></section><section id="products"><h2>العصائر الأكثر مبيعًا والأكثر ربحًا</h2><div class="tables"><div><h3>الأكثر مبيعًا</h3><table><thead><tr><th>العصير</th><th>الكمية</th><th>الإيراد</th></tr></thead><tbody id="bestSold"></tbody></table></div><div><h3>الأكثر ربحًا</h3><table><thead><tr><th>العصير</th><th>الربح</th><th>الهامش</th></tr></thead><tbody id="bestProfit"></tbody></table></div></div></section></main><script src="app.js"></script></body></html>
